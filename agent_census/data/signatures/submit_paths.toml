# URL substrings for the submission endpoints that comment / form spam and other
# submission-endpoint abuse aims at -- comment forms, login, xmlrpc. Matched case-
# insensitively as a substring; a hit corroborates the spam-bot classifier.

submit_paths = [
    "wp-comments-post", "comment", "xmlrpc", "wp-login",
    "/login", "signin", "register", "contact", "sendmail",
]
