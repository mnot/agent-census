# Data harvesters: crawlers that ingest web content into a private, proprietary
# corpus or dataset for their own product -- plagiarism/similarity indexes, data
# brokers, dataset builders. Distinct from public search (search_engine), public
# preservation (archiver), AI/LLM training (ai_crawler), and SEO (seo_marketing).
#
# Add `domains` / `ranges` / `ranges_url` only when the operator publishes a
# verification mechanism; without one an entry is a declared-but-unverifiable
# crawler (recognised by UA, never confirmed or flagged impersonator).

[[agent]]
# https://turnitin.com/robot/crawlerinfo.html -- builds Turnitin's plagiarism corpus.
# Published crawler range 199.47.80.0-199.47.87.255 (the /21 also covers the
# narrower 199.47.82.16-31 Turnitin lists).
ua_substring = "TurnitinBot"
ranges = ["199.47.80.0/21"]

[[agent]]
# https://panscient.com/ -- crawls to build datasets.
ua_substring = "panscient"

[[agent]]
# https://www.diffbot.com/ -- structured-data extraction sold as a product.
ua_substring = "Diffbot"
domains = ["diffbot.com"]

[[agent]]
# Omgili / webz.io -- web data resale.
ua_substring = "Omgilibot"
domains = ["omgili.com"]
