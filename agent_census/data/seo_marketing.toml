# SEO / marketing / brand-monitoring crawlers: backlink indexes, rank trackers,
# social-listening bots. Declared, but crawl for commercial third parties rather
# than to serve the site's own audience. Most publish IP ranges, not reverse DNS.

[[agent]]
# https://ahrefs.com/robot
ua_substring = "AhrefsBot"
domains = ["ahrefs.com", "ahrefs.net"]
ranges_url = "https://api.ahrefs.com/v3/public/crawler-ip-ranges"
asns = [140577]  # Ahrefs Pte Ltd runs its own AS -- recognise it by network too

[[agent]]
# https://www.semrush.com/bot/
ua_substring = "SemrushBot"
asns = [209366]

[[agent]]
