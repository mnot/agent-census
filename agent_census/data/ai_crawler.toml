domains = ["anthropic.com", "claude.ai"]
ranges_url = "https://claude.com/crawling/bots.json"

[[agent]]
ua_substring = "Claude-Web"
domains = ["anthropic.com"]
ranges_url = "https://claude.com/crawling/bots.json"

