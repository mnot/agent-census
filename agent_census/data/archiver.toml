# Web-archiving / preservation crawlers (keep copies of the web, not index it).
# One [[agent]] per crawler. ua_substring is matched case-insensitively against
# the User-Agent. Verified by reverse/forward DNS against the listed domains
# unless an entry carries its own ranges_url.

# Internet Archive / Wayback Machine -- https://archive.org/details/archive.org_bot
# Verified by rDNS: the published range feed sits behind Cloudflare and blocks
# some fetches as bots, so it isn't reliable to pull; rDNS is good enough here.
[[agent]]
ua_substring = "archive.org_bot"
domains = ["archive.org"]

[[agent]]
ua_substring = "ia_archiver"
domains = ["archive.org"]

[[agent]]
ua_substring = "special_archiver"
domains = ["archive.org"]

# Common Crawl -- a nonprofit that publishes an open WARC archive of the web.
# https://commoncrawl.org/ccbot
# The published range list is authoritative ("IP ranges used by CCBot"; FCrDNS is
# only "also recommended"), and CCBot runs on AWS where reverse DNS is unreliable,
# so verify by range with DNS as a fallback rather than requiring both.
[[agent]]
ua_substring = "CCBot"
domains = ["crawl.commoncrawl.org"]
ranges_url = "https://index.commoncrawl.org/ccbot.json"
rdns_fallback = true
