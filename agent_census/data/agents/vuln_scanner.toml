[[agent]]
# Censys' internet-measurement scanner (UA token "CensysInspect", carrying
# +https://about.censys.io/). Censys tells operators to block its subnets *and*
# its ASNs -- it scans from IPs across ASNs it owns beyond the published subnets
# -- so ranges and asns are declared together and combine as an OR: in-subnet is a
# strong VERIFIED, an in-ASN hit outside the subnets is ASN_ASSOCIATED, only a hit
# outside both is an impersonator. Both published at (and verified against):
# https://docs.censys.com/docs/opt-out-of-data-collection
