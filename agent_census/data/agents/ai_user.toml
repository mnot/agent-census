# AI assistants fetching a page at a person's request (ChatGPT-User and its kin). Per the
# operator: whether a person drove any given request isn't observable here. Same [[agent]]
# format as the other files in this directory; see README.md.

# Google's user-triggered AI fetchers.
# https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers
[[agent]]
ua_substring = "Google-GeminiNotebook"
user_triggered = true

[[agent]]
ua_substring = "Google-Pinpoint"
user_triggered = true

[[agent]]
ua_substring = "Google-Agent"
ranges_url = "https://developers.google.com/static/crawling/ipranges/user-triggered-agents.json"
user_triggered = true
wba_operator = "Google"

[[agent]]
ua_substring = "ChatGPT-User"
domains = ["openai.com"]
ranges_url = "https://openai.com/chatgpt-user.json"
rdns_fallback = true
user_triggered = true

[[agent]]
ua_substring = "Claude-User"
ranges_url = "https://claude.com/crawling/bots.json"
rdns_fallback = true
user_triggered = true

[[agent]]
ua_substring = "Perplexity-User"
ranges_url = "https://www.perplexity.ai/perplexity-user.json"
user_triggered = true

[[agent]]
# https://docs.mistral.ai/robots
ua_substring = "MistralAI-User"
ranges_url = "https://mistral.ai/mistralai-user-ips.json"
user_triggered = true

[[agent]]
# https://developer.amazon.com/amazonbot
ua_substring = "Amzn-User"
ranges_url = "https://developer.amazon.com/amazonbot/live-ip-addresses/"
format = "amazon"
user_triggered = true

[[agent]]
# https://developers.facebook.com/docs/sharing/webmasters/web-crawlers/
ua_substring = "Meta-externalfetcher"
user_triggered = true

[[agent]]
ua_substring = "Kimi-User"
ranges_url = "https://www.kimi.com/policies/kimi-user.json"
user_triggered = true

[[agent]]
# https://elevenlabs.io/docs/bots -- fetches pages a customer adds to an agent's knowledge
# base, when they are added and refreshed.
ua_substring = "ElevenlabsBot"
user_triggered = true

[[agent]]
# https://exauser.crawler.exa.ai/ -- fetches a page live when a user or an app built on the Exa
# API asks for it; signed, with no IPs or reverse DNS published.
ua_substring = "ExaUser"
user_triggered = true
wba_operator = "Exa"

[[agent]]
# https://parallel.ai/parallel-web-systems-bots.md -- accesses content on behalf of users and is
# not used to crawl.
ua_substring = "Shap-User"
user_triggered = true
wba_operator = "Parallel"

[[agent]]
# https://app.keenable.ai/bot -- makes requests on someone's behalf; does not crawl.
ua_substring = "Keenable-User"
ranges_url = "https://app.keenable.ai/bot/keenable-user.json"
user_triggered = true
