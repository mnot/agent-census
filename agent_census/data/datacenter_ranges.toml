# IP ranges belonging to datacenter / cloud hosting providers.
#
# A client arriving from one of these ranges while presenting a desktop-browser
# User-Agent is almost certainly automation in disguise, not a person -- see the
# `datacenter` tag and the `spoofed_browser` kind.
#
# This is a deliberately SMALL, hand-maintained starter list, not an exhaustive
# registry. It covers providers seen abusing this site plus a few of the usual
# suspects. Extend it as you spot more. The hyperscalers (AWS, GCP, Azure)
# publish machine-readable range lists that are better fetched than pinned here;
# wiring that up the way crawler `ranges_url` works is a future improvement.

