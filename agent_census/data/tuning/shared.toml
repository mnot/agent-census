# Thresholds used by more than one classifier or tag. They live here, once, so that
# tuning "what counts as browser-like" or "what counts as a 404 storm" moves every
# consumer together instead of drifting between private copies. A threshold only one
# classifier uses stays in that classifier's own file; this file is strictly the
# genuinely-shared ones.

[verdict]
# The confidence a kind must reach to win; below it the honest answer is UNKNOWN.
# Also the level a clean browser-shaped client is floored to, so a brief visit still
# clears the bar. (Used by the combiner and the browser classifier.)
unknown_threshold = 0.45

[browser_shape]
# What counts as browser-like behaviour, defined once for the browser classifier,
# the loads-assets / follows-links / no-assets / cold tags, the generic crawler and
# scraper, and the reference-browser predicate that calibrates the relative tags.
coload_ratio_min = 0.4   # at/above this share of pages co-load sub-resources: browser-like
no_coload_max = 0.1      # below this: essentially no sub-resource co-loading
follow_ratio_min = 0.3   # at/above this share follow on-site links: browser-like
no_follow_max = 0.1      # below this: hits URLs cold, no on-site link-following

[cadence]
# Inter-arrival regularity (coefficient of variation) bands, shared by the browser
# classifier and the metronomic / bursty / steady tags. Below `metronomic_max` is
# clockwork automation; above `bursty_min` is human-irregular; between is steady.
metronomic_max = 0.15
bursty_min = 0.6

[head_traffic]
# A HEAD share above this is notable -- browsers issue GET, so it argues against a
# browser and earns the uses-HEAD tag. (Feed readers and monitors set their own,
# higher, HEAD thresholds in their files; this is the generic "notable" line.)
notable_ratio = 0.1

[fabricated_referer]
# A Referer equal to the requested URL is impossible from real navigation. At or
# above this share, with at least `min_requests` requests, it reads as faked organic
# traffic -- caps the browser verdict and earns the forged-referer tag.
self_referer_min = 0.5
min_requests = 4

[storm_404]
# A 404 rate above `ratio_min` spread across at least `distinct_paths_min` distinct
# missing paths is probing, not a few broken links. Used by the vuln-scanner
# classifier and the 404-storm tag.
ratio_min = 0.6
distinct_paths_min = 15

[impossible_referer]
# A same-site cross-form Referer (the www form of an apex the request was served
# for, or vice versa) is impossible once the site 301s one form to the other -- a
# compliant browser is never *on* the redirect-only form to refer from. Gated on the
# site actually redirecting one form to the other (see [redirect_gate]), this then
# requires a browser UA, no feed activity, and the Referer on a real share of
# requests (a lone hit could be a quirky proxy / extension). Used by the
# impossible-referer tag and the combiner's browser -> spoofed_browser conversion.
ratio_min = 0.5
min_hits = 5

[redirect_gate]
# Infer that the site 301s one host form to the other (www <-> apex) from observed
# traffic rather than a hard-coded rule: within the dominant site's own traffic, the
# share of its www.* requests (and, separately, its non-www requests) that returned a
# 3xx. When exactly one side is at/above `gate_3xx_ratio` (with at least `min_requests`
# requests to judge), that side is the redirect-only "shadow" and the impossible-
# referer signal is armed for it. Scoped per site so a foreign vhost's redirects don't
# arm it. Used by the pipeline.
min_requests = 50
gate_3xx_ratio = 0.9
