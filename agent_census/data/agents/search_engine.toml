# ibou (https://www.ibou.com/crawlers.html): ibou-search and IbouBot verify by reverse DNS
# under ibou.io and a range list; the discovery and news crawlers share a media list, and
# ibou-images has none yet.
[[agent]]
# Reverse DNS only: ibousearch-ip-ranges.json puts an IPv4 and an IPv6 prefix in one object,
# and iprange.parse_prefixes keeps only the first, so using the feed would flag its IPv6.
ua_substring = "ibou-search"
domains = ["ibou.io"]

[[agent]]
# https://www.ibou.com/iboubot.html
ua_substring = "IbouBot"
domains = ["ibou.io"]
ranges_url = "https://www.ibou.com/iboubot-ip-ranges.json"

[[agent]]
ua_substring = "ibou-discovery"
ranges_url = "https://www.ibou.com/iboumedia-ip-ranges.json"

[[agent]]
ua_substring = "ibou-news"
ranges_url = "https://www.ibou.com/iboumedia-ip-ranges.json"

[[agent]]
ua_substring = "ibou-images"

[[agent]]
# https://app.keenable.ai/bot -- builds a search index for AI agents. Keenable plans to sign
# requests but doesn't yet, so it verifies by its published IP list; no reverse DNS.
ua_substring = "KeenableBot"
ranges_url = "https://app.keenable.ai/bot/keenablebot.json"

[[agent]]
# https://help.naver.com/alias/search/site/site_11.naver -- Naver's general web-search robot.
# Naver's verification page: reverse DNS ends in .naver.com, or the IP is in its published list
# (which it says can change without notice). "Yeti/" keeps the token off unrelated "yeti" strings.
ua_substring = "Yeti/"
domains = ["naver.com"]
ranges_url = "https://searchadvisor.naver.com/doc/naverbot.json"

