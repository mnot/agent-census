# Social-preview / link-unfurl fetchers: fetch a URL once to build the rich
# preview card shown when a link is shared in a chat or post.

[[agent]]
# https://developers.facebook.com/docs/sharing/webmasters/web-crawlers/
ua_substring = "facebookexternalhit"
domains = ["facebook.com", "fbsv.net"]

[[agent]]
ua_substring = "Twitterbot"
domains = ["twitter.com", "twttr.com"]

[[agent]]
ua_substring = "LinkedInBot"
domains = ["linkedin.com"]
# https://sourcecidr.com/linkedin/
ranges_url = "https://sourcecidr.com/feeds/linkedin.json"

[[agent]]
# https://api.slack.com/robots
ua_substring = "Slackbot"
domains = ["slack.com"]

[[agent]]
ua_substring = "Slackbot-LinkExpanding"
domains = ["slack.com"]

[[agent]]
ua_substring = "Slack-ImgProxy"
domains = ["slack.com"]

[[agent]]
ua_substring = "Discordbot"
domains = ["discordapp.com", "discord.com"]

[[agent]]
ua_substring = "WhatsApp"
domains = ["whatsapp.net"]

[[agent]]
ua_substring = "TelegramBot"
domains = ["telegram.org"]

[[agent]]
ua_substring = "Pinterest"
domains = ["pinterest.com"]

[[agent]]
# https://help.pinterest.com/en/business/article/pinterestbot
ua_substring = "Pinterestbot"
domains = ["pinterest.com", "pinterestcrawler.com"]

[[agent]]
ua_substring = "redditbot"
domains = ["reddit.com"]

[[agent]]
# https://docs.embed.ly/reference/faq
ua_substring = "Embedly"
ranges = ["107.21.253.49", "54.204.20.249", "54.204.20.250", "54.221.198.105", "54.221.199.147", "54.225.104.196", "2600:1f18:100d:9f00::/52"]

[[agent]]
# https://iframely.com/docs/about
ua_substring = "Iframely"
domains = ["iframe.ly"]

[[agent]]
ua_substring = "vkShare"
domains = ["vk.com"]

[[agent]]
ua_substring = "HatenaBookmark"
domains = ["hatena.ne.jp"]

[[agent]]
ua_substring = "Mastodon"

[[agent]]
ua_substring = "Mattermost-Bot"

[[agent]]
ua_substring = "Pleroma"

[[agent]]
ua_substring = "SummalyBot"

[[agent]]
# https://github.com/Lantern-chat
ua_substring = "Lantern"
