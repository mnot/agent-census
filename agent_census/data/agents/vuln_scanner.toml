# Vulnerability / measurement scanners that publish a fixed origin range, so a
# UA claiming to be one can be authenticated against it under --verify-bots.
#
# Presence here does NOT make a scanner a "good crawler": its kind is still
# decided behaviourally (see classify/vuln_scanner.py). These entries only bind
# the declared identity to a verifiable origin -- in-range confirms it, a
# definitely out-of-range hit on the same UA is an impersonator.
#
# ua_substring is matched case-insensitively. Optional: ranges (inline CIDRs),
# ranges_url (published feed, fetched + cached), domains (rDNS suffixes).

[[agent]]
# Palo Alto Networks' Cortex Xpanse internet-measurement scanner. Its UA carries
# the docs URL below, which contains the "Cortex-Xpanse" token this matches on.
# Ranges published at (and verified against):
# https://docs-cortex.paloaltonetworks.com/r/1/Cortex-Xpanse/Scanning-activity
name = "Cortex Xpanse"
ua_substring = "Cortex-Xpanse"
ranges = [
